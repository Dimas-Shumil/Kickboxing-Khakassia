# Bootstrap HTTP vhost. Enable only after checking for an existing server_name.
# certbot --nginx -d kickboxing19.ru --cert-name kickboxing19.ru --redirect
# adds TLS after DNS for this name points at this server.
server {
    listen 80;
    listen [::]:80;
    server_name kickboxing19.ru;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
